<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观枢终端平台 · 客户端下载</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#232a33;--txt0:#e6edf3;
  --txt1:#c9d1d9;--txt2:#8b949e;--acc:#58a6ff;--ok:#3fb950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt1);
  font:14px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 56px}
header{text-align:center;margin-bottom:32px}
.logo{width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,#1f6feb,#58a6ff);display:inline-flex;
  align-items:center;justify-content:center;font-size:22px;font-weight:700;
  color:#fff;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px;color:var(--txt0);font-weight:600}
.sub{color:var(--txt2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:20px;display:flex;flex-direction:column;gap:12px;
  transition:border-color .15s ease}
.card:hover{border-color:#30363d}
.card.off{opacity:.62}
.os{display:flex;align-items:center;gap:10px}
.os svg{width:22px;height:22px;stroke:var(--acc);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.os b{font-size:15px;color:var(--txt0)}
.meta{font-size:12.5px;color:var(--txt2);min-height:40px}
.meta .v{color:var(--ok);font-weight:600}
.btn{display:block;text-align:center;text-decoration:none;padding:10px 14px;
  border-radius:8px;background:var(--acc);color:#04121f;font-weight:600;
  font-size:13.5px;transition:opacity .15s ease}
.btn:hover{opacity:.88}
.btn.off{background:#21262d;color:var(--txt2);cursor:not-allowed;
  pointer-events:none}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sha{margin-top:10px;font-size:11px;color:#6e7681;word-break:break-all}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--txt2)}
footer code{color:var(--txt1);background:#161b22;padding:2px 6px;
  border-radius:4px}
#msg{grid-column:1/-1;text-align:center;color:var(--txt2);font-size:13px;
  padding:24px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">E</div>
    <h1>观枢终端平台｜EyeTerm 客户端下载</h1>
    <div class="sub">请选择与终端匹配的操作系统版本（始终提供最新发布版本）</div>
    <div class="sub" style="margin-top:9px;color:var(--txt1)">
      需要终端安装后<b style="color:var(--ok)">自动连接本中心</b>（免手工填平台地址与 Token）？
      请向平台管理员索取<span style="color:var(--acc)">定制安装包</span>，
      双击即可完成安装并自动注册。
    </div>
  </header>
  <div id="grid" class="grid"><div id="msg">正在获取版本信息…</div></div>
  <footer>
    下载地址 <code id="host"></code>
    <div style="margin-top:6px">此处提供的是<b>通用安装包</b>（安装后需在本机手动填写平台地址与 Token）；
      通用包与终端自动更新使用同一版本；如无法下载请联系平台管理员</div>
  </footer>
</div>
<script>
var ICONS = {
  windows: '<svg viewBox="0 0 24 24"><path d="M3 5.5 10.5 4.4v7.1H3z"/>'
    + '<path d="M11.5 4.2 21 3v8.5h-9.5z"/><path d="M3 12.5h7.5v7.1L3 18.5z"/>'
    + '<path d="M11.5 12.5H21V21l-9.5-1.2z"/></svg>',
  android: '<svg viewBox="0 0 24 24"><path d="M5 9h14v9a2 2 0 0 1-2 2H7a2'
    + ' 2 0 0 1-2-2z"/><path d="M5 9a7 7 0 0 1 14 0"/>'
    + '<path d="m7.5 4.5 1 1.6M16.5 4.5l-1 1.6"/>'
    + '<path d="M3 10v6M21 10v6"/></svg>',
  linux: '<svg viewBox="0 0 24 24"><path d="M12 3c2 0 3 1.6 3 3.6 0 1.4.5 2'
    + ' 1.5 3.2 1.2 1.4 1.5 2.4 1.5 3.7A4.5 4.5 0 0 1 13.5 18h-3A4.5 4.5'
    + ' 0 0 1 6 13.5c0-1.3.3-2.3 1.5-3.7C8.5 8.6 9 8 9 6.6 9 4.6 10 3'
    + ' 12 3z"/><path d="M6 17.5 4.5 20M18 17.5l1.5 2.5"/></svg>'
};

function esc(s){
  return String(s == null ? "" : s).replace(/&/g, "&amp;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtSize(n){
  if(!n){ return "-"; }
  var u = ["B", "KB", "MB", "GB"], i = 0, v = n;
  while(v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (Math.round(v * 10) / 10) + " " + u[i];
}
function fmtTs(ts){
  if(!ts){ return "-"; }
  var d = new Date(ts * 1000);
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
    + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function render(list){
  var g = document.getElementById("grid");
  if(!list || !list.length){
    g.innerHTML = '<div id="msg">版本信息获取失败，请刷新重试</div>';
    return;
  }
  g.innerHTML = list.map(function(p){
    var on = !!p.available;
    return '<section class="card' + (on ? "" : " off") + '"'
      + ' data-platform="' + esc(p.platform) + '">'
      + '<div class="os">' + (ICONS[p.platform] || "") + "<b>"
      + esc(p.label) + "</b></div>"
      + '<div class="meta">' + (on
          ? '最新版本 <span class="v">' + esc(p.version) + "</span><br>"
            + esc(fmtSize(p.size)) + " · 发布于 " + esc(fmtTs(p.published_at))
          : "暂未发布，敬请期待") + "</div>"
      + '<a class="btn' + (on ? "" : " off") + '"'
      + (on ? ' href="/download/latest/' + esc(p.platform) + '" download' : "")
      + ">" + (on ? "下载安装包" : "暂不可用") + "</a>"
      + (on && p.sha256
          ? '<div class="sha">SHA256 ' + esc(p.sha256) + "</div>" : "")
      + "</section>";
  }).join("");
}

document.getElementById("host").textContent = location.origin;
fetch("/api/v1/download/platforms", {cache: "no-store"})
  .then(function(r){ return r.json(); })
  .then(function(j){ render(j && j.platforms); })
  .catch(function(){
    document.getElementById("grid").innerHTML =
      '<div id="msg">版本信息获取失败，请刷新重试</div>';
  });
</script>
</body>
</html>
